
<!-- ================= HOME PAGE (index.html) ================= --><!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Hub</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f9}
header{background:#ff7a18;color:#fff;padding:15px;text-align:center}
nav{background:#222;padding:10px;text-align:center}
nav a{color:#fff;margin:10px;text-decoration:none}
.products{display:flex;overflow-x:auto;gap:15px;padding:20px}
.product{min-width:200px;background:#fff;padding:10px;border-radius:10px;text-align:center}
.product img{width:100%;height:120px;object-fit:cover}
.btn{background:#ff7a18;color:#fff;padding:8px;border:none;margin-top:5px;display:inline-block;text-decoration:none}
</style>
</head>
<body>
<header><h1>Shop Hub</h1></header>
<nav>
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="support.html">Customer Care</a>
<a href="feedback.html">Feedback</a>
<a href="cart.html">Cart</a>
</nav><h2 style="padding:15px">Trending</h2>
<div class="products">
<div class="product"><img src="https://via.placeholder.com/200"><h3>Headphones</h3><button class="btn" onclick="addToCart('Headphones')">Add</button></div>
<div class="product"><img src="https://via.placeholder.com/200"><h3>Watch</h3><button class="btn" onclick="addToCart('Watch')">Add</button></div>
<div class="product"><img src="https://via.placeholder.com/200"><h3>Mouse</h3><button class="btn" onclick="addToCart('Mouse')">Add</button></div>
<div class="product"><img src="https://via.placeholder.com/200"><h3>Keyboard</h3><button class="btn" onclick="addToCart('Keyboard')">Add</button></div>
</div><script>
let cart=JSON.parse(localStorage.getItem('cart'))||[];
function addToCart(item){
cart.push(item);
localStorage.setItem('cart',JSON.stringify(cart));
alert(item+" added to cart");
}
</script></body>
</html><!-- =================
